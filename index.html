<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KITPRO</title><style>
:root{--b:#079fe8;--d:#057eb8}*{box-sizing:border-box}body{margin:0;font-family:Arial;background:linear-gradient(180deg,var(--b),var(--d));color:#fff;min-height:100vh;padding-bottom:82px}.top{height:100px;display:flex;align-items:center;justify-content:space-between;padding:15px 20px}.brand{background:#ffe500;color:#111;border:4px solid #111;padding:3px 14px;font-size:32px;font-weight:900;font-style:italic;box-shadow:4px 4px #111}.brand small{display:block;text-align:right;font-size:9px;font-style:normal}.icon{font-size:32px;background:none;border:0;color:#fff}.screen{max-width:1100px;margin:auto;padding:8px 16px}.heading{text-align:center;font-size:27px;font-weight:900;margin:12px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.tile{min-height:170px;border:2px solid #fff;border-radius:22px;background:#078fd0;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:12px;font-weight:900}.tile img{width:80px;height:80px;object-fit:contain}.plus{font-size:62px;font-weight:300}.panel,.kit{background:#fff;color:#111;border-radius:20px;padding:16px;margin-bottom:14px}.info{display:flex;align-items:center;gap:14px}.info img{width:75px;height:75px;object-fit:contain}.info h2{margin:0}.back{color:#078ed0;font-weight:900;margin-bottom:12px;cursor:pointer}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}.btn{border:0;border-radius:11px;background:var(--b);color:#fff;padding:11px 14px;font-weight:900}.red{background:#e54848}.gray{background:#ddd;color:#111}.kitpart{border-top:1px solid #ddd;padding:12px 0}.kitpart img{display:block;width:100%;max-height:280px;object-fit:contain;background:#f5f5f5;border-radius:12px;margin:8px 0}.url{display:flex;gap:6px}.url input{flex:1;min-width:0;padding:10px;border:1px solid #bbb;border-radius:8px}.bottom{position:fixed;z-index:20;bottom:0;left:0;right:0;height:78px;background:#fff;color:#111;display:grid;grid-template-columns:repeat(4,1fr)}.nav{border:0;border-right:1px solid #ddd;background:#fff;font-weight:900}.nav b{display:block;font-size:24px}.nav.active{background:#eee}.modalbg{display:none;position:fixed;inset:0;background:#0009;z-index:50;align-items:flex-end}.modalbg.open{display:flex}.modal{background:#fff;color:#111;width:100%;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:20px}.field{margin:10px 0}.field label{display:block;font-weight:900;margin-bottom:5px}.field input,.field select{width:100%;padding:12px;border:1px solid #bbb;border-radius:9px}.notice{background:#eef8fd;padding:11px;border-radius:10px;font-size:13px}.empty{background:#fff;color:#555;border-radius:18px;padding:22px;text-align:center;grid-column:1/-1}.adminbar{background:#fff;color:#111;padding:10px 14px;border-radius:15px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}.hide{display:none!important}@media(min-width:700px){.grid{grid-template-columns:repeat(4,1fr)}.bottom{max-width:700px;left:50%;transform:translateX(-50%);border-radius:16px 16px 0 0}}
</style></head><body><header class="top"><button class="icon" onclick="app.menu()">☰</button><div class="brand">KITPRO<small>KITS COLLECTION</small></div><button class="icon" onclick="app.search()">⌕</button></header><main id="screen" class="screen"></main><nav class="bottom"><button class="nav active" data-p="home"><b>⌂</b>INICIO</button><button class="nav" data-p="leagues"><b>⚽</b>LIGAS</button><button class="nav" data-p="teams"><b>👕</b>EQUIPOS</button><button class="nav" data-p="fav"><b>★</b>FAVORITOS</button></nav><div id="modalbg" class="modalbg"><div id="modal" class="modal"></div></div><script>
const ADMIN_PASSWORD='1234';const DB='kitpro_public_v1';let admin=sessionStorage.getItem('kitpro_admin')==='1';let db={leagues:[],teams:[],kits:[]};let state={p:'home',league:null,team:null};
function loadLocal(){try{let x=JSON.parse(localStorage.getItem(DB));if(x&&x.leagues)return x}catch(e){}return null}async function boot(){let local=loadLocal();try{let r=await fetch('./data.json',{cache:'no-store'});if(r.ok){let remote=await r.json();db=remote}}catch(e){}if(local&&!db.leagues.length)db=local;let q=new URLSearchParams(location.search);let team=q.get('team');if(team)state.team=team;render()}
function save(){localStorage.setItem(DB,JSON.stringify(db))}function eid(p){return p+'_'+Date.now()+Math.random().toString(36).slice(2,6)}function esc(x){return String(x||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function by(a,id){return a.find(x=>x.id===id)}function img(u){return u?`<img src="${esc(u)}" onerror="this.style.opacity=.15">`:''}
function setp(p){state={p,league:null,team:null};document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.p===p));render()}document.querySelectorAll('.nav').forEach(n=>n.onclick=()=>setp(n.dataset.p));
function render(){if(state.team)return teamView(state.team);if(state.league)return leagueView(state.league);if(state.p==='leagues')return leagues();if(state.p==='teams')return teams();if(state.p==='fav')return fav();home()}
function adminBar(){return admin?`<div class="adminbar"><b>🔐 MODO ADMINISTRADOR</b><button class="btn gray" onclick="app.logout()">Salir</button></div>`:''}
function home(){let h=adminBar()+'<div class="heading">MIS LIGAS</div><div class="grid">';db.leagues.forEach(l=>h+=leagueTile(l));if(admin)h+=`<button class="tile" onclick="app.leagueForm()"><span class="plus">+</span>Añadir Liga</button>`;if(!db.leagues.length&&!admin)h+='<div class="empty">Todavía no hay ligas publicadas.</div>';h+='</div>';screen(h)}
function leagues(){let h=adminBar()+'<div class="heading">LIGAS</div><div class="grid">';db.leagues.forEach(l=>h+=leagueTile(l));if(admin)h+=`<button class="tile" onclick="app.leagueForm()"><span class="plus">+</span>Añadir Liga</button>`;if(!db.leagues.length&&!admin)h+='<div class="empty">Todavía no hay ligas publicadas.</div>';h+='</div>';screen(h)}
function leagueTile(l){return `<button class="tile" onclick="app.openLeague('${l.id}')">${img(l.crest)}<span>${esc(l.name)}</span></button>`}
function leagueView(id){let l=by(db.leagues,id);if(!l)return setp('leagues');let ts=db.teams.filter(t=>t.leagueId===id);let h=`<div class="panel"><div class="back" onclick="setp('leagues')">← Volver</div><div class="info">${img(l.crest)}<div><h2>${esc(l.name)}</h2><div>${ts.length} equipos</div></div></div>`;if(admin)h+=`<div class="actions"><button class="btn" onclick="app.teamForm('${id}')">+ Añadir Equipo</button><button class="btn red" onclick="app.delLeague('${id}')">Eliminar</button></div>`;h+='</div><div class="heading">EQUIPOS</div><div class="grid">';ts.forEach(t=>h+=teamTile(t));if(!ts.length)h+='<div class="empty">No hay equipos publicados en esta liga.</div>';if(admin)h+=`<button class="tile" onclick="app.teamForm('${id}')"><span class="plus">+</span>Añadir Equipo</button>`;h+='</div>';screen(h)}
function teamTile(t){return `<button class="tile" onclick="app.openTeam('${t.id}')">${img(t.crest)}<span>${esc(t.name)}</span></button>`}
function teams(){let h=adminBar()+'<div class="heading">EQUIPOS</div><div class="grid">';db.teams.forEach(t=>h+=teamTile(t));if(admin)h+=`<button class="tile" onclick="app.teamForm()"><span class="plus">+</span>Añadir Equipo</button>`;if(!db.teams.length&&!admin)h+='<div class="empty">Todavía no hay equipos publicados.</div>';h+='</div>';screen(h)}
function fav(){let ts=db.teams.filter(t=>t.favorite);let h=adminBar()+'<div class="heading">FAVORITOS</div><div class="grid">';ts.forEach(t=>h+=teamTile(t));if(!ts.length)h+='<div class="empty">No tienes favoritos.</div>';h+='</div>';screen(h)}
function teamView(id){let t=by(db.teams,id);if(!t)return setp('teams');let ks=db.kits.filter(k=>k.teamId===id);let l=by(db.leagues,t.leagueId);let h=`<div class="panel"><div class="back" onclick="${l?`app.openLeague('${l.id}')`:`setp('teams')`}">← Volver</div><div class="info">${img(t.crest)}<div><h2>${esc(t.name)}</h2><div>${ks.length} kits</div></div><button class="icon" onclick="app.fav('${id}')">${t.favorite?'★':'☆'}</button></div>`;if(admin)h+=`<div class="actions"><button class="btn" onclick="app.kitForm('${id}')">+ Añadir Kit</button><button class="btn red" onclick="app.delTeam('${id}')">Eliminar</button></div>`;h+='</div>';if(!ks.length)h+='<div class="empty">Este equipo todavía no tiene kits.</div>';ks.forEach(k=>h+=kit(k));screen(h)}
function kit(k){let ps=[['LOGO',k.crest],['KITS LOCAL',k.home],['KITS VISITANTE',k.away],['PORTERO LOCAL',k.gkHome],['PORTERO VISITANTE',k.gkAway]];let h=`<section class="kit"><h2>${esc(k.name)}</h2>`;ps.forEach(p=>{h+=`<div class="kitpart"><b>${p[0]}</b>${img(p[1])}<div class="url"><input readonly value="${esc(p[1])}"><button class="btn" onclick="app.copy(this)">Copiar 🔗</button></div></div>`});if(admin)h+=`<div class="actions"><button class="btn red" onclick="app.delKit('${k.id}')">Eliminar kit</button></div>`;h+='</section>';return h}
function screen(h){document.getElementById('screen').innerHTML=h}
function openModal(h){modal.innerHTML=h;modalbg.classList.add('open')}function close(){modalbg.classList.remove('open')}
function login(){openModal(`<h2>Administrador</h2><div class="field"><label>Contraseña</label><input id="pw" type="password" placeholder="Contraseña"></div><div class="notice">Solo el administrador puede añadir, editar o eliminar contenido.</div><div class="actions"><button class="btn" onclick="app.doLogin()">Entrar</button><button class="btn gray" onclick="close()">Cancelar</button></div>`)}
function doLogin(){if(document.getElementById('pw').value===ADMIN_PASSWORD){admin=true;sessionStorage.setItem('kitpro_admin','1');close();render()}else alert('Contraseña incorrecta')}
function menu(){if(admin){openModal(`<h2>Administrador</h2><p>Modo administrador activo.</p><div class="actions"><button class="btn" onclick="app.exportData()">Descargar datos</button><button class="btn gray" onclick="close()">Cerrar</button></div>`)}else login()}
function leagueForm(){if(!admin)return login();openModal(`<h2>Crear Liga</h2><div class="field"><label>Nombre</label><input id="ln"></div><div class="field"><label>URL del escudo</label><input id="lc"></div><div class="actions"><button class="btn" onclick="app.saveLeague()">Guardar</button><button class="btn gray" onclick="close()">Cancelar</button></div>`)}
function saveLeague(){let n=ln.value.trim();if(!n)return alert('Escribe el nombre');db.leagues.push({id:eid('l'),name:n,crest:lc.value.trim()});save();close();render()}
function teamForm(leagueId=''){if(!admin)return login();let opts='<option value="">Sin liga</option>'+db.leagues.map(l=>`<option value="${l.id}" ${l.id===leagueId?'selected':''}>${esc(l.name)}</option>`).join('');openModal(`<h2>Añadir Equipo</h2><div class="field"><label>Nombre</label><input id="tn"></div><div class="field"><label>URL escudo</label><input id="tc"></div><div class="field"><label>Liga</label><select id="tl">${opts}</select></div><div class="actions"><button class="btn" onclick="app.saveTeam()">Guardar</button><button class="btn gray" onclick="close()">Cancelar</button></div>`)}
function saveTeam(){let n=tn.value.trim();if(!n)return alert('Escribe el nombre');db.teams.push({id:eid('t'),name:n,crest:tc.value.trim(),leagueId:tl.value,favorite:false});save();close();render()}
function kitForm(tid){if(!admin)return login();openModal(`<h2>Añadir Kit</h2><div class="field"><label>Nombre del kit</label><input id="kn" value="KITS ${esc(by(db.teams,tid)?.name||'')}"></div><div class="field"><label>URL Logo</label><input id="kc"></div><div class="field"><label>URL Kit Local</label><input id="kh"></div><div class="field"><label>URL Kit Visitante</label><input id="ka"></div><div class="field"><label>URL Portero Local</label><input id="kg1"></div><div class="field"><label>URL Portero Visitante</label><input id="kg2"></div><div class="actions"><button class="btn" onclick="app.saveKit('${tid}')">Guardar</button><button class="btn gray" onclick="close()">Cancelar</button></div>`)}
function saveKit(tid){db.kits.push({id:eid('k'),teamId:tid,name:kn.value.trim()||'Kit',crest:kc.value.trim(),home:kh.value.trim(),away:ka.value.trim(),gkHome:kg1.value.trim(),gkAway:kg2.value.trim()});save();close();state.team=tid;render()}
function copy(b){let i=b.parentNode.querySelector('input');navigator.clipboard?.writeText(i.value).catch(()=>{});i.select();try{document.execCommand('copy')}catch(e){}b.textContent='¡Copiado!';setTimeout(()=>b.textContent='Copiar 🔗',900)}
function fav(id){let t=by(db.teams,id);t.favorite=!t.favorite;save();render()}
function delLeague(id){if(!confirm('¿Eliminar liga y sus equipos?'))return;let tids=db.teams.filter(t=>t.leagueId===id).map(t=>t.id);db.leagues=db.leagues.filter(l=>l.id!==id);db.teams=db.teams.filter(t=>t.leagueId!==id);db.kits=db.kits.filter(k=>!tids.includes(k.teamId));save();setp('leagues')}
function delTeam(id){if(!confirm('¿Eliminar equipo y kits?'))return;db.teams=db.teams.filter(t=>t.id!==id);db.kits=db.kits.filter(k=>k.teamId!==id);save();setp('teams')}
function delKit(id){if(!confirm('¿Eliminar kit?'))return;db.kits=db.kits.filter(k=>k.id!==id);save();render()}
function exportData(){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:'application/json'}));a.download='data.json';a.click()}
function logout(){admin=false;sessionStorage.removeItem('kitpro_admin');render()}
function search(){let q=prompt('Buscar equipo o liga');if(!q)return;let x=q.toLowerCase();let t=db.teams.find(t=>t.name.toLowerCase().includes(x));if(t){state.team=t.id;render();return}let l=db.leagues.find(l=>l.name.toLowerCase().includes(x));if(l){state.league=l.id;render();return}alert('No encontrado')}
window.app={menu,search,doLogin,logout,leagueForm,saveLeague,teamForm,saveTeam,kitForm,saveKit,openLeague:id=>{state.league=id;state.team=null;render()},openTeam:id=>{state.team=id;state.league=null;history.replaceState({},'',location.pathname+'?team='+id);render()},fav,delLeague,delTeam,delKit,copy,exportData};boot();
</script></body></html>
